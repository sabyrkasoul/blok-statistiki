<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блок статистики</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <section class="stats">
      <h2 class="visually-hidden">Ваша статистика</h2>
      <ul class="stats__list">
        <li class="stats__item">
          <article class="stat-card">
            <header class="stat-card__header">
              <h3 class="stat-card__title">Подписчики</h3>
              <span class="stat-card__badge violet" aria-hidden="true"></span>
            </header>
            <p class="stat-card__value">12K</p>
            <footer class="stat-card__footer">
              <span class="stat-card__period">За 30 дней</span>
              <span class="stat-card__trend positive">+12%</span>
            </footer>
          </article>
        </li>
        <li class="stats__item">
          <article class="stat-card">
            <header class="stat-card__header">
              <h3 class="stat-card__title">Просмотры</h3>
              <span class="stat-card__badge orange" aria-hidden="true"></span>
            </header>
            <p class="stat-card__value">87K</p>
            <footer class="stat-card__footer">
              <span class="stat-card__period">За неделю</span>
              <span class="stat-card__trend positive">+4%</span>
            </footer>
          </article>
        </li>
        <li class="stats__item">
          <article class="stat-card">
            <header class="stat-card__header">
              <h3 class="stat-card__title">Продажи</h3>
              <span class="stat-card__badge green" aria-hidden="true"></span>
            </header>
            <p class="stat-card__value">324</p>
            <footer class="stat-card__footer">
              <span class="stat-card__period">За месяц</span>
              <span class="stat-card__trend positive">+12%</span>
            </footer>
          </article>
        </li>
      </ul>
    </section>
  </body>
</html>
